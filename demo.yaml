apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: demo-app
  name: demo-app
  namespace: demo-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      #serviceAccountName: demo-app-sa
      containers:
        - name: demo
          image: public.ecr.aws/nginx/nginx:1.31
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 1
